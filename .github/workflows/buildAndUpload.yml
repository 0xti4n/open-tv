name: Build and Upload

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-binstall
        if: matrix.os == 'windows-latest'
        shell: bash
        run: cargo install cargo-binstall --locked

      - name: Install Dioxus CLI 0.7.10
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-22.04" ]]; then
            cargo install dioxus-cli --version 0.7.10 --locked
          else
            cargo binstall dioxus-cli@0.7.10 -y --force || cargo install dioxus-cli --version 0.7.10 --locked --force
          fi
          dx --version

      - name: Download mpv
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $nightlyPage = "https://nightly.link/mpv-player/mpv/workflows/build/master"
          $response = Invoke-WebRequest -Uri $nightlyPage -UseBasicParsing
          $latestUrl = $response.Links.Href | Where-Object { $_ -match "x86_64-pc-windows-msvc\.zip$" } | Select-Object -First 1

          $retryCount = 3
          $retryDelay = 5

          for ($i = 1; $i -le $retryCount; $i++) {
              try {
                  Invoke-WebRequest -UserAgent "Wget" -Uri $latestUrl -OutFile .\mpv.zip
                  break
              }
              catch {
                  Start-Sleep -Seconds $retryDelay
              }
          }

          New-Item -Path 'C:\nyx-tv-deps' -ItemType Directory -Force
          7z e .\mpv.zip -oC:\nyx-tv-deps mpv.exe vulkan-1.dll -y

      - name: Download ffmpeg
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $retryCount = 3
          $retryDelay = 5
          for ($i = 1; $i -le $retryCount; $i++) {
              try {
                  Invoke-WebRequest -UserAgent "Wget" -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip" -OutFile .\ffmpeg.zip
                  break
              }
              catch {
                  Write-Host "Error occurred: $_. Retrying in $retryDelay seconds..."
                  Start-Sleep -Seconds $retryDelay
              }
          }
          7z e .\ffmpeg.zip -oC:\nyx-tv-deps ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe

      - name: Download yt-dlp
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $retryCount = 3
          $retryDelay = 5
          for ($i = 1; $i -le $retryCount; $i++) {
              try {
                  Invoke-WebRequest -UserAgent "Wget" -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile yt-dlp.exe
                  break
              }
              catch {
                  Write-Host "Error occurred: $_. Retrying in $retryDelay seconds..."
                  Start-Sleep -Seconds $retryDelay
              }
          }
          Move-Item -Path yt-dlp.exe -Destination C:\nyx-tv-deps

      - name: Install deps linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
          libgtk-3-dev

      - name: Build MSI
        if: matrix.os == 'windows-latest'
        shell: bash
        working-directory: desktop
        run: |
          dx bundle --platform desktop --release --package-types msi

      - name: Build DEB
        if: matrix.os == 'ubuntu-22.04'
        working-directory: desktop
        run: dx bundle --platform desktop --release --package-types deb

      - name: Build RPM
        if: matrix.os == 'ubuntu-22.04'
        working-directory: desktop
        run: |
          # Dioxus reuses bundle.deb.depends for RPM Requires, so replace Debian package names.
          python3 -c 'from pathlib import Path; import re; p=Path("Dioxus.toml"); s=p.read_text(); pattern=r"(?ms)(^\[bundle\.deb\]\s*\n.*?^depends\s*=\s*)\[[^\]]*\]"; s,n=re.subn(pattern, lambda match: match.group(1) + "[\"mpv\", \"ffmpeg\", \"yt-dlp\", \"webkit2gtk4.1\", \"gtk3\", \"libxdo\"]", s); assert n == 1; p.write_text(s)'
          dx bundle --platform desktop --release --package-types rpm

      - name: Upload MSI
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nyx-tv-windows
          path: target/dx/nyx-tv/bundle/windows/msi/*.msi
          retention-days: 60

      - name: Upload DEB
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: nyx-tv-debian
          path: target/dx/nyx-tv/bundle/linux/deb/*.deb
          retention-days: 60

      - name: Upload RPM
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: nyx-tv-redhat
          path: target/dx/nyx-tv/bundle/linux/rpm/*.rpm
          retention-days: 60
