[package]
name = "open_tv"
version = "1.9.1"
edition = "2024"
rust-version = "1.91.1"

[[bin]]
name = "open_tv"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7.10", features = ["desktop", "router"] }
icons = { version = "0.18", features = ["dioxus"] }
open_tv_lib = { path = "../backend" }
rfd = "0.15"
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1.48.0", features = ["time", "sync"] }
tw_merge = "0.1"
