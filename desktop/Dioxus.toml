[application]
name = "open_tv"
default_platform = "desktop"
asset_dir = "assets"

[bundle]
identifier = "dev.fredol.open-tv"
publisher = "Fredolx"
icon = ["icons/32x32.png", "icons/128x128.png", "icons/icon.png", "icons/icon.ico", "icons/icon.icns"]
category = "Multimedia"
short_description = "Fast and powerful IPTV app"
long_description = "Fred TV is an IPTV application that plays video in mpv."

[windows.wix]
fragment_paths = ["windows/fragments/deps.wxs"]
component_group_refs = ["DependencyComponents"]
component_refs = ["MpvComponent", "FfmpegComponent", "YtDlpComponent"]
